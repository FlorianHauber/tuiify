[package]
name = "spotui"
version = "0.1.0"
edition = "2021"
description = "A fast, highly customizable Spotify TUI remote for Linux, written in Rust"
license = "MIT"

[dependencies]
ratatui = "0.29"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "net", "io-util"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
anyhow = "1"
sha2 = "0.10"
base64 = "0.22"
rand = "0.8"
image = { version = "0.25", default-features = false, features = ["jpeg", "png"] }
rustfft = "6"
dirs = "5"
unicode-width = "0.2"
libc = "0.2"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
